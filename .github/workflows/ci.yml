name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: better-payment (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    defaults:
      run:
        working-directory: packages/better-payment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck examples
        run: pnpm typecheck:examples

      - name: Test (with coverage thresholds)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Bundle size
        run: pnpm size

      - name: Check package contents
        run: |
          test -f dist/index.js && test -f dist/index.mjs && test -f dist/index.d.ts
          test -f dist/client/index.js && test -f dist/client/index.d.ts
          npm pack --dry-run
