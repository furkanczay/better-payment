name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: 'false'
        type: boolean
      npm_tag:
        description: 'npm dist-tag (an explicit tag is required to publish a version lower than the current latest)'
        required: false
        default: 'latest'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test
        working-directory: packages/better-payment
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build package
        working-directory: packages/better-payment
        run: pnpm build

      - name: Publish to NPM
        if: ${{ inputs.dry_run == false || inputs.dry_run == 'false' }}
        working-directory: packages/better-payment
        run: pnpm publish --access public --no-git-checks --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}

      - name: Dry run publish
        if: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
        working-directory: packages/better-payment
        run: pnpm publish --access public --no-git-checks --tag "$NPM_TAG" --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}
